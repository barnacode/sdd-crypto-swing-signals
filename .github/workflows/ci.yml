name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install TA-Lib C library
        run: |
          sudo apt-get update
          sudo apt-get install -y ta-lib0 ta-lib0-dev || true

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync dependencies (incl. indicators)
        run: uv sync --group dev --extra indicators

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Dependency audit
        run: uvx pip-audit || true   # report; do not fail the build on advisories yet

      - name: Tests + coverage gate (>=80%)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=80

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
