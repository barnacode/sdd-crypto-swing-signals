[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — advisory short-swing crypto signals (Phase 1, advisory only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "ccxt>=4.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "aiogram>=3.15",
    "slowapi>=0.1.9",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7",
    "pandas>=2.2",
    "numpy>=2.1",
    "structlog>=24.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# pandas-ta-classic is pure-Python and is the PRIMARY indicator engine.
indicators = [
    "pandas-ta-classic>=0.3",
]
# TA-Lib is an OPTIONAL accelerator; it needs the TA-Lib C library on the host
# (`brew install ta-lib` / `apt-get install ta-lib0-dev`).
talib = [
    "TA-Lib>=0.4",
]
backtest = [
    "vectorbt>=0.26",
    "backtesting>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/aegis"]
branch = true

[tool.coverage.report]
# Constitution C-8 / CLAUDE.md §13: minimum coverage gate fixed at 80% (2026-06-14).
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# S101 (assert) is fine in tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/aegis"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas_ta_classic.*", "pandas.*"]
ignore_missing_imports = true
